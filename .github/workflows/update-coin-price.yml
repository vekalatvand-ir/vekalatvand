name: update-coin-price (every 6 hours)

on:
  schedule:
    # هر ۶ ساعت یکبار
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch sekee price and update files
        run: |
          python3 - <<'PY'
          import re, json, urllib.request, datetime, pathlib
          UA = {"User-Agent": "Mozilla/5.0 (Linux; Android 10) VekalatvandBot/1.0"}
          price_toman = None
          try:
              req = urllib.request.Request("https://www.tgju.org/profile/sekee", headers=UA)
              html = urllib.request.urlopen(req, timeout=25).read().decode("utf-8", "ignore")
              m = re.search(r'data-col="info\.last_trade\.PDrCotVal">([\d,]+)<', html)
              if m:
                  rial = int(m.group(1).replace(",", ""))
                  price_toman = round(rial / 10)
          except Exception as e:
              print("fetch failed:", e)
          print("price_toman=", price_toman)
          if not price_toman or not (20000000 < price_toman < 1000000000):
              print("price out of range, abort without changes")
              raise SystemExit(0)
          today = datetime.date.today().isoformat()
          due = (datetime.date.today() + datetime.timedelta(days=1)).isoformat()
          p = pathlib.Path("assets/coin-price.json")
          meta = {"symbol":"SEKE_EMAMI","label_fa":"سکه تمام بهار آزادی (امامی)","unit":"toman",
                  "price_toman":price_toman,"price_rial":price_toman*10,
                  "updated_at":today,"next_update_due":due,"update_cycle_days":1,
                  "source":"tgju-profile-sekee","source_url":"https://www.tgju.org/profile/sekee",
                  "note_fa":"قیمت چند بار در روز به‌صورت خودکار به‌روز می‌شود. ملاک نهایی دادگاه، قیمت روز پرداخت است."}
          p.write_text(json.dumps(meta, ensure_ascii=False, indent=2), encoding="utf-8")
          print("wrote", p)
          # به‌روزرسانی مقدار پیش‌فرض در صفحه اصلی
          idx = pathlib.Path("index.html")
          if idx.exists():
              t = idx.read_text(encoding="utf-8")
              t2 = re.sub(r'(id="coinPrice"[^>]*?value=")\d+(")', r'\g<1>%d\g<2>' % price_toman, t)
              if t2 != t:
                  idx.write_text(t2, encoding="utf-8")
                  print("patched index.html default")
          # به‌روزرسانی مقدار پیش‌فرض در صفحه محاسبه نرخ روز (بخش چهارم مهریه)
          m4 = pathlib.Path("legal-center/mahrieh/mohasebe-nrkh-rooz/index.html")
          if m4.exists():
              t = m4.read_text(encoding="utf-8")
              t2 = re.sub(r'(id="m4cPrice"[^>]*>)\d+(<)', r'\g<1>%d\g<2>' % price_toman, t)
              t2 = re.sub(r"(vals:\{count:'114',price:')\d+(')", r'\g<1>%d\g<2>' % price_toman, t2)
              t2 = re.sub(r"(price:'?)\d+('?,)", r'\g<1>%d\g<2>' % price_toman, t2)
              if t2 != t:
                  m4.write_text(t2, encoding="utf-8")
                  print("patched mohasebe page default")
          PY
      - name: Commit if changed
        run: |
          git config user.name "vekalatvand-bot"
          git config user.email "bot@vekalatvand.local"
          git add assets/coin-price.json index.html legal-center/mahrieh/mohasebe-nrkh-rooz/index.html || true
          git diff --cached --quiet && echo "no changes" || (git commit -m "auto: update coin price (4-day cycle)" && git push)
